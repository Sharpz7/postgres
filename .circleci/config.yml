version: 2.1

# Builds are explicitly approved and do not publish mutable tags or call SharpCD.
# Production uses locally built, dated images until deployment automation is replaced.
jobs:
  build:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Build security-updated image
          command: docker build --pull --no-cache -t "local/security-check:${CIRCLE_SHA1}" .
  build-pgadmin:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Build patched pgAdmin overlay
          command: docker build --pull --no-cache -t "local/pgadmin-security-check:${CIRCLE_SHA1}" pgadmin
workflows:
  security-build:
    jobs:
      - approve-build:
          type: approval
      - build:
          requires:
            - approve-build
      - build-pgadmin:
          requires:
            - approve-build
